<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVU STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f5f7; color: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card-container { width: 100%; max-width: 380px; text-align: center; background: #ffffff; border: 2px solid #e2d1a3; border-radius: 24px; padding: 35px 22px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.07); }
        .logo-box { margin-bottom: 25px; }
        .logo-title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #b8860b; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
        .subtitle { font-size: 12px; color: #777777; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, #b8860b, transparent); margin: 20px 0 25px 0; }
        .links-wrapper { display: flex; flex-direction: column; gap: 14px; }
        .btn { display: flex; align-items: center; justify-content: flex-start; padding: 14px 20px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 15px; transition: all 0.25s ease; border: 1px solid #e8e8e8; background: #ffffff; color: #222222; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .btn i { font-size: 22px; width: 35px; text-align: center; margin-left: 10px; }
        .btn:active, .btn:hover { transform: translateY(-2px); border-color: #b8860b; box-shadow: 0 6px 15px rgba(184, 134, 11, 0.15); }
        .btn-call { background: linear-gradient(135deg, #d4af37, #b8860b); color: #ffffff !important; border: none; justify-content: center; }
        .btn-call i { color: #ffffff !important; margin-left: 5px; }
        .btn-whatsapp i { color: #25D366; }
        .btn-save i { color: #b8860b; }
        .btn-instagram i { color: #E1306C; }
        .btn-tiktok i { color: #000000; }
        .btn-facebook i { color: #1877F2; }
        .footer { margin-top: 30px; font-size: 11px; color: #aaa; font-weight: 600; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="card-container">
    <div class="logo-box">
        <h1 class="logo-title">GAVU STORE</h1>
        <p class="subtitle">CLOTHING & SNEAKERS</p>
    </div>

    <div class="divider"></div>

    <div class="links-wrapper">
        <a href="tel:01000000000" class="btn btn-call">
            <i class="fa-solid fa-phone"></i>
            <span>اتصال تلفوني مباشر</span>
        </a>

        <a href="https://wa.me/201000000000" target="_blank" class="btn btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
            <span>تواصل عبر الواتساب</span>
        </a>

        <a href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3AGAVU%20STORE%0ATEL%3BTYPE%3DCELL%3A01000000000%0AEND%3AVCARD" class="btn btn-save">
            <i class="fa-solid fa-address-card"></i>
            <span>حفظ الرقم في الهاتف</span>
        </a>

        <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
            <i class="fa-brands fa-instagram"></i>
            <span>تابعنا على إنستجرام</span>
        </a>

        <a href="https://tiktok.com" target="_blank" class="btn btn-tiktok">
            <i class="fa-brands fa-tiktok"></i>
            <span>تابعنا على تيك توك</span>
        </a>

        <a href="https://facebook.com" target="_blank" class="btn btn-facebook">
            <i class="fa-brands fa-facebook"></i>
            <span>صفحتنا على فيسبوك</span>
        </a>
    </div>

    <div class="footer">
        <p>POWERED BY NFC CARD</p>
    </div>
</div>

</body>
</html>
