<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klicko | كليكو - كروت وخدمات NFC الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(0, 210, 255, 0.2);
            --primary-blue: #00D2FF;
            --secondary-blue: #0072FF;
            --text-color: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 114, 255, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Profile Header */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 20px 22px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .logo-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            position: relative;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.35);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #000;
            display: block;
        }

        .brand-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #FFFFFF 40%, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--primary-blue);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .brand-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            padding: 0 6px;
        }

        /* Unified Action Buttons */
        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary-blue);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.25);
            background: rgba(22, 32, 54, 0.9);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        /* Unified Icon Backgrounds */
        .save-card .btn-icon { background: linear-gradient(135deg, #00D2FF, #0072FF); }
        .whatsapp .btn-icon { background: #25D366; }
        .phone .btn-icon { background: linear-gradient(135deg, #00D2FF, #0072FF); }
        .tiktok .btn-icon { background: #000000; border: 1px solid rgba(255, 255, 255, 0.2); }

        .arrow-icon {
            font-size: 13px;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: var(--primary-blue);
        }

        /* Services Grid */
        .services-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 18px 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .services-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #E2E8F0;
        }

        .service-item i {
            display: block;
            font-size: 20px;
            color: var(--primary-blue);
            margin-bottom: 6px;
        }

        .footer {
            text-align: center;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .footer span {
            color: var(--primary-blue);
            font-weight: 800;
        }
    </style>
</head>
<body>

            <a href="tel:01556760265" class="btn phone">

                </div>
                <i class="fa-
ervice-item">

                <div class="service-item">

                <div class="service-item">
