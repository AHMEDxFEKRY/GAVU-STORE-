    <!-- Script for VCard Generation -->
    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Klicko | كروت NFC ذكية
ORG:Klicko Smart Solutions
TEL;TYPE=CELL,VOICE:01556760265
URL:https://www.tiktok.com/@klicko.eg
NOTE:خدمات NFC ذكية لكروت الشغل والمحلات والشركات
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Klicko_NFC.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
